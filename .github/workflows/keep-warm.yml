# Render's free plan puts the API to sleep after 15 minutes without requests, and waking it takes up to a
# minute. Pinging the health endpoint every 13 minutes keeps it awake (one always-on free service fits
# within Render's 750 free instance hours per month).
name: Keep API awake

on:
  schedule:
    # GitHub uses UTC (IST minus 5:30). Pings run from 6:30 AM to about 11 PM IST; the server may sleep overnight.
    - cron: "*/13 1-16 * * *"      # 6:30 AM - 10:29 PM IST
    - cron: "0,13,26 17 * * *"     # 10:30, 10:43, 10:56 PM IST
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl --silent --show-error --fail --max-time 120 --retry 3 --retry-delay 10 https://biomvira-api.onrender.com/api/health
